# codemagic.yaml — buildy aplikacji mobilnej PrzetargAI (Expo / React Native)
#
# Aplikacja jest w katalogu mobile/ (monorepo) — skrypty wchodzą do mobile/.
# Natywne katalogi ios/ i android/ NIE są w repo — generuje je w CI `expo prebuild`.
#
# Konfiguracja po stronie Codemagic UI (wymagana przed pierwszym buildem):
#  - Integracja App Store Connect API (rola Admin) — nazwa musi zgadzać się poniżej.
#  - Grupa zmiennych „ios_signing" z CERTIFICATE_PRIVATE_KEY (klucz RSA, base64, Secure).
#  - Keystore Androida (android_signing) — referencja „przetargai_keystore".
#  - Grupa „google_credentials" ze zmienną GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
#    (Google Play, JSON konta usługi — nazwa musi zgadzać się z sekcją publishing).
# Szczegóły: runbooks/deploy.md.

workflows:

  # ============================ iOS ============================
  ios-release:
    name: PrzetargAI iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # BEZ bloku `integrations:` — integracja nazwana „ProbWin AI Connect Key"
    # żyje w INNYM zespole Codemagic niż ten z billingiem (lekcja 2026-07-10).
    # Poświadczenia ASC idą jawnie zmiennymi APP_STORE_CONNECT_* (grupa ios_signing);
    # `app-store-connect` i `xcode-project` czytają je automatycznie ze środowiska.
    environment:
      groups:
        - ios_signing            # zawiera CERTIFICATE_PRIVATE_KEY (base64, Secure)
        - produkcja              # EXPO_PUBLIC_API_URL -> backend Cloud Functions (D-043)
      vars:
        BUNDLE_ID: pl.przetargai.app
        APPLE_TEAM_ID: B7J6A7R258  # poziom konta — nie jest sekretem
        XCODE_SCHEME: PrzetargAI   # nazwa schematu generowanego przez `expo prebuild`
      node: 24
      xcode: latest
      cocoapods: default
    # UWAGA: świadomie BEZ deklaratywnego bloku `ios_signing:` — robi pre-check
    # i pada na „No matching profiles found", gdy profil tworzymy dopiero w skrypcie.
    scripts:
      - name: Instalacja zależności
        script: cd mobile && npm ci
      - name: Expo prebuild (iOS)
        script: cd mobile && npx expo prebuild --platform ios --no-install
      - name: Instalacja CocoaPods
        script: cd mobile/ios && pod install
      - name: Code signing
        script: |
          set -ex
          keychain initialize
          echo "$CERTIFICATE_PRIVATE_KEY" | base64 --decode > "$HOME/key.pem"
          chmod 600 "$HOME/key.pem"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --create \
            --certificate-key=@file:"$HOME/key.pem"
          keychain add-certificates
          cd mobile
          xcode-project use-profiles \
            --export-options-plist "$CM_BUILD_DIR/export_options.plist"
      - name: Numer builda
        script: cd mobile/ios && agvtool new-version -all $(($BUILD_NUMBER + 100))
      - name: Build IPA
        script: |
          set -ex
          cd mobile
          xcode-project build-ipa \
            --workspace "ios/$XCODE_SCHEME.xcworkspace" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist "$CM_BUILD_DIR/export_options.plist"
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

  # ========================== Android ==========================
  android-release:
    name: PrzetargAI Android (Google Play — internal)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      android_signing:
        - przetargai_keystore   # NOWY keystore dla PrzetargAI (keystore jest per-aplikacja)
      groups:
        - google_credentials    # zawiera GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        - produkcja             # EXPO_PUBLIC_API_URL -> backend Cloud Functions (D-043)
      vars:
        PACKAGE_NAME: pl.przetargai.app
      node: 24
    scripts:
      - name: Instalacja zależności
        script: cd mobile && npm ci
      - name: Kontrola google-services.json
        # app.json wskazuje ./google-services.json (FCM). Bez tego pliku prebuild
        # pada z mało czytelnym „Cannot copy google-services.json". To konfiguracja
        # klienta (nie sekret) — ma być w repo; ten krok daje jasny komunikat.
        script: |
          test -f mobile/google-services.json || {
            echo "BRAK mobile/google-services.json — dodaj plik do repo (to nie sekret)."
            exit 1
          }
      - name: Expo prebuild (Android)
        script: cd mobile && npx expo prebuild --platform android --no-install
      - name: Konfiguracja podpisu release
        script: cd mobile && node scripts/configure-android-release-signing.mjs
      - name: Numer wersji
        # build.gradle z prebuilda (Expo 54) HARDKODUJE `versionCode 1` i nie czyta
        # gradle.properties — wpis tam był no-opem i Play odrzucałby każdy kolejny
        # upload („Version code 1 has already been used"). Podmieniamy wartość
        # bezpośrednio w wygenerowanym pliku i weryfikujemy, że podmiana zaszła.
        script: |
          set -ex
          cd mobile/android
          NOWY=$(($BUILD_NUMBER + 100))
          sed -i "s/versionCode 1$/versionCode $NOWY/" app/build.gradle
          grep -q "versionCode $NOWY" app/build.gradle
      - name: Build AAB
        script: cd mobile/android && ./gradlew bundleRelease
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
