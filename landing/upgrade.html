<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Przejdź na PrzetargAI Standard</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><text x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>P</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="center-page">
    <div class="panel">
      <a class="brand" href="/" style="justify-content:center;margin-bottom:24px">
        <span class="brand__mark">P</span>
        <span class="brand__name">PrzetargAI</span>
      </a>
      <h1 class="panel__title">PrzetargAI Standard</h1>
      <div class="panel__price">49 zł <span>/ miesiąc</span></div>
      <ul class="plan__list" style="text-align:left">
        <li>Nielimitowane dopasowane przetargi</li>
        <li>Powiadomienia push o nowych przetargach</li>
        <li>Faktura VAT automatycznie po opłaceniu</li>
      </ul>
      <button class="btn btn--primary btn--block btn--lg" id="payBtn">Przejdź do płatności</button>
      <p class="status" id="status"></p>
      <p class="panel__note">Płatność obsługuje Stripe. Po opłaceniu wróć do aplikacji PrzetargAI — Twój plan zaktualizuje się automatycznie.</p>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="upgrade.js"></script>
</body>
</html>
