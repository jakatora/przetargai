      - generic [ref=f1e72]:
        - heading "Informacje o Bazie Konkurencyjności" [level=2] [ref=f1e76]
        - generic [ref=f1e78]:
          - paragraph [ref=f1e79]: To jest aktualna wersja Bazy Konkurencyjności. Można tu założyć konto, publikować ogłoszenia i składać oferty. Ogłoszenia ze starej wersji Bazy Konkurencyjności są dostępne pod jej archiwalnym adresem.
          - paragraph [ref=f1e80]
          - paragraph [ref=f1e81]: Baza Konkurencyjności to internetowa baza ofert zawierająca ogłoszenia beneficjentów. Wbudowana wyszukiwarka ogłoszeń pozwala w szybki i łatwy sposób odnaleźć zapytania ofertowe zamieszczone przez beneficjentów. Publikacja ogłoszeń beneficjentów jest warunkiem spełnienia tzw. zasady konkurencyjności. Zasada konkurencyjności odnosi się do beneficjentów korzystających z Europejskiego Funduszu Rozwoju Regionalnego, Europejskiego Funduszu Społecznego oraz Funduszu Spójności i jest regulowana na poziomie wytycznych w zakresie kwalifikowalności wydatków. Internetowa baza ofert pozwala w jednym miejscu zgromadzić zamówienia składane przez beneficjentów/wnioskodawców.
          - paragraph [ref=f1e82]
          - paragraph [ref=f1e83]: W przypadku pytań lub wątpliwości, zachęcamy do kontaktu ze wsparciem technicznym.
          - paragraph [ref=f1e84]: Ogłoszenia zamieszczane na poprzedniej wersji Bazy Konkurencyjności zachowują ważność i wciąż są dostępne w archiwalnej wersji Bazy Konkurencyjności, której adres widnieje poniżej.
          - paragraph [ref=f1e85]
          - paragraph [ref=f1e86]: "Archiwalna wersja Bazy Konkurencyjności jest dostępna pod adresem:"
          - paragraph [ref=f1e87]: https://archiwum-bazakonkurencyjnosci.funduszeeuropejskie.gov.pl/
          - paragraph [ref=f1e88]
          - paragraph [ref=f1e89]: Portal współfinansowany przez Unię Europejską ze środków Funduszu Spójności w ramach Programu Operacyjnego Pomoc Techniczna.
